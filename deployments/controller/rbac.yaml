apiVersion: v1
kind: ServiceAccount
metadata:
  name: dozlab-controller
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dozlab-controller-role
rules:
# LabSession CRD permissions
- apiGroups:
  - dozlab.io
  resources:
  - labsessions
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
- apiGroups:
  - dozlab.io
  resources:
  - labsessions/status
  verbs:
  - get
  - update
  - patch
- apiGroups:
  - dozlab.io
  resources:
  - labsessions/finalizers
  verbs:
  - update
# Core resource permissions
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - secrets
  - persistentvolumeclaims
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
# Event permissions
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
# Leader election permissions
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
  - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dozlab-controller-rolebinding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dozlab-controller-role
subjects:
- kind: ServiceAccount
  name: dozlab-controller
  namespace: default

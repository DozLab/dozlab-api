apiVersion: apps/v1
kind: Deployment
metadata:
  name: dozlab-controller
  namespace: default
  labels:
    app: dozlab-controller
    component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dozlab-controller
  template:
    metadata:
      labels:
        app: dozlab-controller
    spec:
      serviceAccountName: dozlab-controller
      containers:
      - name: controller
        image: dozman99/dozlab-controller:latest
        imagePullPolicy: Always
        command:
        - /controller
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --health-probe-bind-address=:8081
        - --max-concurrent-reconciles=10
        - --sync-period=10m
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: VERSION
          value: "v1.0.0"
        ports:
        - name: metrics
          containerPort: 8080
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          capabilities:
            drop:
            - ALL
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: dozlab-controller-metrics
  namespace: default
  labels:
    app: dozlab-controller
spec:
  type: ClusterIP
  ports:
  - name: metrics
    port: 8080
    targetPort: metrics
    protocol: TCP
  selector:
    app: dozlab-controller
